AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "pkg/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

# 宽松但有限的规模门槛覆盖生产代码；测试和基准的场景编排不按方法长度及 ABC 计数。
# 需要更高分支复杂度的协议状态机仅在对应方法说明豁免原因。
Metrics/AbcSize:
  Max: 120
  Exclude:
    - "test/**/*"
    - "benchmark/**/*"

Metrics/BlockLength:
  Max: 80

Metrics/BlockNesting:
  Max: 4
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Max: 500

Metrics/MethodLength:
  Max: 80
  Exclude:
    - "test/**/*"
    - "benchmark/**/*"

Metrics/ModuleLength:
  Max: 250

Metrics/ParameterLists:
  Max: 6
  CountKeywordArgs: false

Metrics/CyclomaticComplexity:
  Max: 13
  Exclude:
    - "test/**/*"

Metrics/PerceivedComplexity:
  Max: 13
  Exclude:
    - "test/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Exclude:
    - "test/**/*"

Naming/RescuedExceptionsVariableName:
  PreferredName: error

Layout/LineLength:
  Max: 120

Style/HashSyntax:
  EnforcedShorthandSyntax: always
